[package]
name = "shablonizator"
version = "0.2.0"
description = "Шаблонізатор — локальна система формування службових документів"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
zip = "2"
chrono = "0.4"
quick-xml = "0.41"
semver = "1"
