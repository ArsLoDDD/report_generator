name: Windows installers

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Версія офлайн-оновлення (наприклад 0.3.0)
        required: true
        type: string
      notes:
        description: Короткий опис змін для користувача
        required: true
        type: string

jobs:
  verify:
    name: Перевірки
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run test:full

  build:
    name: Просунута версія та файл оновлення
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Зібрати інсталятор і підписаний файл оновлення
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_NOTES: ${{ inputs.notes }}
          COMMIT_NOTES: ${{ github.event.head_commit.message }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) {
            $version = node -p "require('./package.json').version"
          }
          $notes = $env:REQUESTED_NOTES
          if (-not $notes) {
            $notes = $env:COMMIT_NOTES
          }
          if (-not $notes) {
            $notes = "Оновлення Шаблонізатора $version"
          }
          npm run update:build -- --version $version --notes $notes --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Shablonizator-Advanced-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/*.shupd
          if-no-files-found: error

  pull-request-build:
    name: Перевірка збірки просунутої версії
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run tauri:build:advanced
