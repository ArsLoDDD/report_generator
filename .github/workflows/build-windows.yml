name: Windows installers

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Версія офлайн-оновлення (наприклад 0.3.0)
        required: true
        type: string
      notes:
        description: Короткий опис змін для користувача
        required: true
        type: string

jobs:
  verify:
    name: Перевірки
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run test:full

  build:
    name: Просунута версія
    if: github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Зібрати інсталятор
        run: npm run tauri:build:advanced
      - uses: actions/upload-artifact@v4
        with:
          name: Shablonizator-Advanced-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  offline-update:
    name: Підписаний файл оновлення
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Зібрати та підписати файл оновлення
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_VERSION: ${{ inputs.version }}
          UPDATE_NOTES: ${{ inputs.notes }}
        run: npm run update:build -- --version $env:UPDATE_VERSION --notes $env:UPDATE_NOTES --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Shablonizator-Advanced-Update-${{ inputs.version }}
          path: release/*.shupd
          if-no-files-found: error
