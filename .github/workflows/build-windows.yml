name: Windows installers

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Перевірки
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run test:full

  build:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: simple
            label: Проста версія
            artifact: Shablonizator-Simple-Windows
          - edition: advanced
            label: Просунута версія
            artifact: Shablonizator-Advanced-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Зібрати інсталятор
        run: npm run tauri:build:${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
