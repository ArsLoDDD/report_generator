name: Windows update and installer

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Версія офлайн-оновлення (наприклад 0.3.0)
        required: true
        type: string
      notes:
        description: Короткий опис змін для користувача
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Перевірки
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Відновити кеш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-ci
      - run: npm ci
      - run: npm run test:full

  build-update:
    name: Файл оновлення
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Відновити кеш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-ci
      - name: Відновити кеш NSIS
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-3.11-utils-0.5.3-windows
      - run: npm ci
      - name: Зібрати підписаний файл оновлення
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_NOTES: ${{ inputs.notes }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) {
            $version = node -p "require('./package.json').version"
          }
          $notes = $env:REQUESTED_NOTES
          if ($notes) {
            npm run update:build -- --version $version --notes $notes --skip-tests
          } else {
            npm run update:build -- --version $version --skip-tests
          }
      - name: Підготувати файл оновлення
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path update-artifact -Force | Out-Null
          Copy-Item -Path "release/*.shupd" -Destination update-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: Shablonizator-Update-Windows
          path: update-artifact/*.shupd
          if-no-files-found: error
      - name: Підготувати інсталятор
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path installer-artifact -Force | Out-Null
          Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination installer-artifact
      - name: Завантажити інсталятор
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Shablonizator-Installer-Windows
          path: installer-artifact/*.exe
          if-no-files-found: error
