name: Збірка для Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Windows інсталятор
    runs-on: windows-latest

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Встановити Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Встановити залежності
        run: npm ci

      - name: Перевірити застосунок
        run: npm run test -- --run

      - name: Зібрати Windows-інсталятор
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis,msi

      - name: Завантажити результат
        uses: actions/upload-artifact@v4
        with:
          name: RaportGen-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
