name: Збірка для Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows інсталятор
    runs-on: windows-latest

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Встановити Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Встановити залежності
        run: npm ci

      - name: Перевірити застосунок
        run: npm run test:full

      - name: Зібрати Windows-інсталятор
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis

      - name: Завантажити результат
        uses: actions/upload-artifact@v4
        with:
          name: Shablonizator-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
